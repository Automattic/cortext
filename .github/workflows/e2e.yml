name: E2E

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        name: Detect changed paths
        runs-on: ubuntu-latest
        outputs:
            e2e_changed: ${{ steps.changed_paths.outputs.e2e_changed }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0

            - id: changed_paths
              shell: bash
              run: |
                  set -euo pipefail

                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    base="${{ github.event.pull_request.base.sha }}"
                    head="${{ github.event.pull_request.head.sha }}"
                  else
                    base="${{ github.event.before }}"
                    head="${{ github.sha }}"
                  fi

                  if [ "$base" = "0000000000000000000000000000000000000000" ]; then
                    changed_files="$(git diff-tree --no-commit-id --name-only -r "$head")"
                  else
                    changed_files="$(git diff --name-only "$base" "$head")"
                  fi

                  e2e_paths='^(\.github/workflows/e2e\.yml|composer\.(json|lock)|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|playwright\.config\.js|webpack\.config\.js|\.wp-env\.json|cortext\.php|includes/|templates/|src/|build/|tests/e2e/|assets/brand/|seed-assets/|scripts/wp-env-seed\.mjs|scripts/strip-emoji-cdn-loader\.js)'

                  if [ -n "$changed_files" ] && grep -Eq "$e2e_paths" <<< "$changed_files"; then
                    echo "e2e_changed=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "e2e_changed=false" >> "$GITHUB_OUTPUT"
                  fi

    playwright:
        name: Playwright (shard ${{ matrix.shard }}/4)
        runs-on: ubuntu-latest
        needs: changes
        if: needs.changes.outputs.e2e_changed == 'true'
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]
        steps:
            - uses: actions/checkout@v7.0.1

            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.1'
                  tools: composer:v2
                  coverage: none

            - uses: actions/cache@v6.1.0
              with:
                  path: ~/.composer/cache
                  key: composer-${{ hashFiles('composer.lock') }}

            - run: composer install --no-interaction --prefer-dist --no-dev

            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
              with:
                  version: 11.0.8
                  standalone: true

            - uses: actions/setup-node@v7
              with:
                  node-version: '24.15'
                  cache: 'pnpm'

            - run: pnpm install --frozen-lockfile

            # wp-env spends most of its time building Docker images, so start it
            # in the background and let the browser install and build run
            # meanwhile. The process outlives this step; "Wait for wp-env" joins it.
            - name: Start wp-env in the background
              run: |
                  ( pnpm run env:start; echo $? > /tmp/env.status ) > /tmp/env.log 2>&1 < /dev/null &
                  echo $! > /tmp/env.pid

            - run: pnpm exec playwright install --with-deps chromium

            - run: pnpm run build

            - name: Wait for wp-env
              run: |
                  tail -n +1 -f --pid="$(cat /tmp/env.pid)" /tmp/env.log
                  exit "$(cat /tmp/env.status)"

            - run: pnpm run test:e2e --shard=${{ matrix.shard }}/4
              env:
                  WP_BASE_URL: http://localhost:8888
                  # Chromium is installed above; skip wp-scripts' download of every browser.
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

            - if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-artifacts-${{ matrix.shard }}
                  path: |
                      artifacts/
                      playwright-report/
                  retention-days: 7

    # Required status check on main. Shard jobs get matrix names, so this job
    # reports one result under the stable name.
    playwright-result:
        name: Playwright
        runs-on: ubuntu-latest
        needs: [changes, playwright]
        if: always()
        steps:
            - run: |
                  if [ "${{ needs.changes.result }}" != "success" ]; then
                    echo "Path detection: ${{ needs.changes.result }}"
                    exit 1
                  fi
                  case "${{ needs.playwright.result }}" in
                    success|skipped) exit 0 ;;
                    *) echo "Playwright shards: ${{ needs.playwright.result }}"; exit 1 ;;
                  esac
