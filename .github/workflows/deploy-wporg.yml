name: Deploy to WordPress.org SVN

on:
    release:
        types: [released]
    workflow_dispatch:
        inputs:
            version:
                description: 'Release version to deploy, for example 0.2.0'
                required: true
            commit:
                description: 'Commit to WordPress.org SVN'
                required: true
                default: false
                type: boolean
            readme_only:
                description: 'Update readme.txt in trunk and the existing version tag'
                required: true
                default: false
                type: boolean

permissions:
    contents: read

concurrency:
    group: cortext-wporg-deploy-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
    cancel-in-progress: false

# Stable GitHub Releases go to WordPress.org. The dry run runs first; the SVN
# commit waits for wordpress-org approval. Manual dispatch stays available for
# reruns and one-off deploys.
jobs:
    dry-run:
        name: Dry run
        runs-on: ubuntu-latest
        env:
            VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
        steps:
            - uses: actions/checkout@v7.0.1

            - name: Check release is deployable
              env:
                  GH_TOKEN: ${{ github.token }}
                  README_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.readme_only || false }}
              run: |
                  set -euo pipefail

                  if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "::error::Release versions must use the WordPress-style format 0.1.0, without a leading \"v\". Received \"$VERSION\"."
                    exit 1
                  fi

                  release_json="$(gh release view "$VERSION" --json isPrerelease,assets)"

                  if [ "$(jq -r '.isPrerelease' <<< "$release_json")" = "true" ]; then
                    echo "::error::Release $VERSION is a prerelease, and prereleases do not deploy to WordPress.org."
                    exit 1
                  fi

                  if ! jq -e '.assets[] | select(.name == "cortext.zip")' <<< "$release_json" > /dev/null; then
                    echo "::error::Release $VERSION has no cortext.zip asset."
                    exit 1
                  fi

                  if [ "$README_ONLY" = "true" ]; then
                    stable_tag="$(awk -F': *' '/^Stable tag:/ { print $2; exit }' readme.txt)"
                    if [ "$stable_tag" != "$VERSION" ]; then
                      echo "::error::Expected readme stable tag $VERSION, found $stable_tag"
                      exit 1
                    fi
                    if ! awk -v version="$VERSION" '$0 == "= " version " =" { found = 1 } END { exit !found }' readme.txt; then
                      echo "::error::readme.txt has no changelog entry for $VERSION"
                      exit 1
                    fi
                  fi

            - name: Install Subversion
              run: |
                  sudo apt-get update
                  sudo apt-get install -y subversion

            - name: Preview WordPress.org SVN deploy
              env:
                  GH_TOKEN: ${{ github.token }}
                  README_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.readme_only || false }}
              run: |
                  args=( --version "$VERSION" )
                  [ "$README_ONLY" != "true" ] || args+=( --readme-only )
                  ./scripts/deploy-wporg.sh "${args[@]}"

    publish:
        name: Publish
        needs: dry-run
        if: ${{ github.event_name == 'release' || inputs.commit }}
        runs-on: ubuntu-latest
        environment: wordpress-org
        env:
            VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
        steps:
            - uses: actions/checkout@v7.0.1

            - name: Install Subversion
              run: |
                  sudo apt-get update
                  sudo apt-get install -y subversion

            - name: Publish to WordPress.org SVN
              env:
                  GH_TOKEN: ${{ github.token }}
                  README_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.readme_only || false }}
                  WPORG_USERNAME: ${{ secrets.WPORG_USERNAME }}
                  WPORG_PASSWORD: ${{ secrets.WPORG_PASSWORD }}
              run: |
                  set -euo pipefail

                  if [ -z "$WPORG_USERNAME" ] || [ -z "$WPORG_PASSWORD" ]; then
                    echo "::error::Set WPORG_USERNAME and WPORG_PASSWORD as wordpress-org environment secrets before publishing."
                    exit 1
                  fi

                  args=( --version "$VERSION" --commit )
                  [ "$README_ONLY" != "true" ] || args+=( --readme-only )
                  ./scripts/deploy-wporg.sh "${args[@]}"
